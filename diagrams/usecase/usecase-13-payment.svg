">C&#7893;ng thanh to&#225;n</text><text fill="#000000" font-family="sans-serif" font-size="43.75" lengthAdjust="spacing" textLength="323.3185" x="2272.4628" y="1934.5061">(MoMo / VNPay)</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="51" id="ent0016"><path d="M439.7812,362.5 L439.7812,598.1445 L2034.8344,598.1445 L2034.8344,393.75 L2003.5844,362.5 L439.7812,362.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.5625;"/><path d="M2003.5844,362.5 L2003.5844,393.75 L2034.8344,393.75 L2003.5844,362.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:3.125;"/><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1529.4281" x="458.5312" y="420.2972">IPN x&#225;c nh&#7853;n thanh to&#225;n (server-to-server: verify ch&#7919; k&#253; + kh&#7899;p s&#7889; ti&#7873;n, idempotent):</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1190.6418" x="458.5312" y="471.3959">- Th&#224;nh c&#244;ng: order.status = 'processing' + paymentStatus = 'paid'</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1128.2364" x="481.1051" y="522.4945">&#8594; t&#259;ng discount.usedCount, x&#243;a gi&#7887; h&#224;ng, g&#7917;i email x&#225;c nh&#7853;n.</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1177.2125" x="458.5312" y="573.5931">- Th&#7845;t b&#7841;i: ch&#7881; paymentStatus = 'failed' (order.status KH&#212;NG &#273;&#7893;i).</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="58" id="ent0019"><path d="M442.375,18.75 L442.375,254.3945 L2032.231,254.3945 L2032.231,50 L2000.981,18.75 L442.375,18.75" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.5625;"/><path d="M2000.981,18.75 L2000.981,50 L2032.231,50 L2000.981,18.75" fill="#FEFFDD" style="stroke:#181818;stroke-width:3.125;"/><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1524.231" x="461.125" y="76.5472">C&#7893;ng redirect tr&#236;nh duy&#7879;t KH v&#7873; site (KH g&#7885;i endpoint; c&#7893;ng cung c&#7845;p params &#273;&#227; k&#253;).</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="735.5743" x="461.125" y="127.6459">MoMo: ch&#7881; redirect (&#273;&#7893;i tr&#7841;ng th&#225;i &#7903; IPN).</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1118.7744" x="461.125" y="178.7445">VNPay: C&#211; mutate state &#8212; verify s&#7889; ti&#7873;n + mark paid, r&#7891;i t&#259;ng</text><text fill="#000000" font-family="sans-serif" font-size="40.625" lengthAdjust="spacing" textLength="1088.504" x="483.6989" y="229.8431">discount.usedCount, x&#243;a gi&#7887;, g&#7917;i email (gi&#7889;ng IPN success).</text></g><!--link customer to UC_momo--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="association" data-source-line="40" id="lnk10"><path d="M253.5938,1021.8125 C308.7813,997.2188 376.5625,969.875 439.7812,952.1875 C608.0938,905.0938 801.8438,874.9063 955.875,856.375" fill="none" id="customer-UC_momo" style="stroke:#181818;stroke-width:3.125;"/></g><!--link customer to UC_vnpay--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="association" data-source-line="41" id="lnk11"><path d="M253.5938,1132.5625 C308.7813,1157.1563 376.5625,1184.5 439.7812,1202.1875 C606.0625,1248.7188 797.2188,1278.75 950.3438,1297.3438" fill="none" id="customer-UC_vnpay" style="stroke:#181818;stroke-width:3.125;"/></g><!--link customer to UC_return--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" data-link-type="association" data-source-line="42" id="lnk12"><path d="M253.8125,1077.1875 C411.75,1077.1875 701.4375,1077.1875 925.125,1077.1875" fill="none" id="customer-UC_return" style="stroke:#181818;stroke-width:3.125
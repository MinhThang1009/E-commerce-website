name: CI/CD Pipeline

on:
  push:
    branches: [main, 'phase-*', 'feat/*', 'fix/*', 'refactor/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !contains(github.ref, 'refs/heads/main') }}

defaults:
  run:
    shell: bash

# ─── BACKEND ─────────────────────────────────────────────────────────────────
jobs:
  backend:
    name: "Backend: Unit Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend (zero warnings)
        working-directory: backend
        run: npm run lint:strict

      - name: Lint migrations (kiểm tra down() rollback)
        run: bash scripts/lint-migrations.sh

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run tests + coverage
        working-directory: backend
        run: |
          npx jest --ci --runInBand --forceExit \
            --coverage \
            --coverageReporters=text-summary \
            --coverageReporters=json-summary
        env:
          NODE_ENV: test
          DB_NAME: techstore_test
          DB_USER: root
          DB_PASSWORD: ''
          DB_HOST: localhost
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-minimum-32-chars' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'demo-key' }}
          EMAIL_USERNAME: test@test.com
          EMAIL_PASSWORD: test

      - name: Enforce coverage thresholds
        working-directory: backend
        run: |
          node -e "
          const s = require('./coverage/coverage-summary.json').total;
          const fail = [];
          if (s.statements.pct < 97) fail.push('Statements: ' + s.statements.pct + '% < 97%');
          if (s.lines.pct < 97) fail.push('Lines: ' + s.lines.pct + '% < 97%');
          if (s.branches.pct < 85) fail.push('Branches: ' + s.branches.pct + '% < 85%');
          if (s.functions.pct < 95) fail.push('Functions: ' + s.functions.pct + '% < 95%');
          if (fail.length) { console.error('Coverage thresholds FAILED:'); fail.forEach(f => console.error('  ✗', f)); process.exit(1); }
          console.log('Coverage OK — Stmts:', s.statements.pct + '%', '| Lines:', s.lines.pct + '%', '| Branches:', s.branches.pct + '%', '| Fns:', s.functions.pct + '%');
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/coverage-summary.json
          retention-days: 7

# ─── BACKEND INTEGRATION (MySQL) ─────────────────────────────────────────────
  backend-integration:
    name: "Backend: Integration & E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: techstore_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Seed test database
        working-directory: backend
        run: |
          mysql -h 127.0.0.1 -u root techstore_test < data/migration.sql
          mysql -h 127.0.0.1 -u root techstore_test < data/seed_data.sql
        env:
          MYSQL_PWD: ''

      - name: Integration tests
        working-directory: backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: techstore_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-minimum-32-chars' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'demo-key' }}

      - name: API HTTP tests
        working-directory: backend
        run: npm run test:api
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: techstore_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-minimum-32-chars' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'demo-key' }}
          EMAIL_USERNAME: test@test.com
          EMAIL_PASSWORD: test

      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: techstore_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-minimum-32-chars' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'demo-key' }}
          EMAIL_USERNAME: test@test.com
          EMAIL_PASSWORD: test

# ─── FRONTEND ────────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend: Lint, Typecheck, Tests & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests + coverage (threshold gate)
        working-directory: frontend
        run: npm run test:ci

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8888/api

      - name: Bundle size check (budget 10MB)
        working-directory: frontend
        run: |
          SIZE=$(du -sm dist/ | cut -f1)
          echo "📏 Bundle: ${SIZE}MB"
          [ "$SIZE" -le 10 ] || (echo "❌ Bundle ${SIZE}MB vượt budget 10MB"; exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

# ─── PATCH QUALITY (chỉ PR) ──────────────────────────────────────────────────
  patch-quality:
    name: "Quality Gate: Patch Coverage & API Audit"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # cần lịch sử git để diff vs base ref

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: API thừa / orphan (informational)
        working-directory: backend
        run: npm run check:routes

      - name: Doc-freshness — CLAUDE.md stale (informational)
        env:
          CHECK_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/check-doc-freshness.mjs

      - name: Doc-vs-code values — check-docs (informational)
        working-directory: backend
        run: npm run check-docs
        continue-on-error: true

      - name: i18n key parity vi/en (gate)
        run: node scripts/check-i18n.js

      - name: Patch-coverage gate BE (code mới phải có test phủ)
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long-xx
          PATCH_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:patch-coverage

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Dead-code FE (knip, informational)
        working-directory: frontend
        run: npm run check:unused

      - name: Patch-coverage gate FE (code mới phải có test phủ)
        working-directory: frontend
        env:
          PATCH_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:patch-coverage

# ─── CD BUILD ARTIFACT (chỉ main) ───────────────────────────────────────────
  cd-artifact:
    name: "CD: Build & Package Release"
    runs-on: ubuntu-latest
    needs: [backend, frontend, backend-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
        env:
          VITE_API_URL: /api

      - name: Package release artifact
        run: |
          mkdir -p release
          cp -r frontend/dist release/frontend
          cp -r backend/src release/backend-src
          cp backend/package.json backend/package-lock.json release/
          cp backend/data/migration.sql backend/data/seed_data.sql release/
          echo "${{ github.sha }}" > release/COMMIT_SHA
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/BUILD_TIME
          tar -czf release.tar.gz -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 30

# ─── SUMMARY ─────────────────────────────────────────────────────────────────
  summary:
    name: "CI: Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [backend, frontend, backend-integration, patch-quality]
    if: always()
    steps:
      - name: Check results
        run: |
          BE="${{ needs.backend.result }}"
          FE="${{ needs.frontend.result }}"
          INT="${{ needs.backend-integration.result }}"
          PQ="${{ needs.patch-quality.result }}"
          echo "Backend:       $BE"
          echo "Frontend:      $FE"
          echo "Integration:   $INT"
          echo "Patch quality: $PQ"
          [ "$BE" = "success" ] && [ "$FE" = "success" ] && echo "✅ CI passed" || (echo "❌ CI failed"; exit 1)
          if [ "$INT" != "success" ] && [ "$INT" != "skipped" ]; then echo "⚠️  Integration tests failed"; fi
          if [ "$PQ" != "success" ] && [ "$PQ" != "skipped" ]; then echo "⚠️  Patch quality failed"; fi

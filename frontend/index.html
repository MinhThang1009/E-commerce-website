<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="TechStore - Điện thoại, Laptop, Tablet và thiết bị công nghệ chính hãng tại Hà Nội"
    />
    <title>TechStore - Cửa hàng công nghệ</title>
    <!-- Script chặn FOIT (flash of incorrect theme) và set background ngay để loading không bị sai màu -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
          /* Set background NGAY để loading screen không bị xanh đen
           * #111111 = neutral dark (R=G=B=17, không zinc-blue)
           */
          document.documentElement.style.backgroundColor = '#111111';
          if (document.body) document.body.style.backgroundColor = '#111111';
        } else {
          document.documentElement.style.backgroundColor = '#ffffff';
          if (document.body) document.body.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

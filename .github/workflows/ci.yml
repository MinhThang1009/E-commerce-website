name: CI

on:
  push:
    branches: [main, 'phase-*', 'feat/*', 'fix/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !contains(github.ref, 'refs/heads/main') }}

defaults:
  run:
    shell: bash

# ─── BACKEND ─────────────────────────────────────────────────────────────────
jobs:
  backend:
    name: Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend (zero warnings)
        working-directory: backend
        run: npm run lint:strict

      - name: Lint migrations (kiểm tra down() rollback)
        run: bash scripts/lint-migrations.sh

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run tests + coverage
        working-directory: backend
        run: |
          npx jest --ci --runInBand --forceExit \
            --coverage \
            --coverageReporters=text-summary \
            --coverageReporters=json-summary
        env:
          NODE_ENV: test
          DB_NAME: techstore_test
          DB_USER: root
          DB_PASSWORD: ''
          DB_HOST: localhost
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-chars-long' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-minimum-32-chars' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'demo-key' }}
          EMAIL_USERNAME: test@test.com
          EMAIL_PASSWORD: test

      - name: Enforce coverage thresholds
        working-directory: backend
        run: |
          node -e "
          const s = require('./coverage/coverage-summary.json').total;
          const fail = [];
          if (s.statements.pct < 98) fail.push('Statements: ' + s.statements.pct + '% < 98%');
          if (s.lines.pct < 98) fail.push('Lines: ' + s.lines.pct + '% < 98%');
          if (s.branches.pct < 85) fail.push('Branches: ' + s.branches.pct + '% < 85%');
          if (s.functions.pct < 95) fail.push('Functions: ' + s.functions.pct + '% < 95%');
          if (fail.length) { console.error('Coverage thresholds FAILED:'); fail.forEach(f => console.error('  ✗', f)); process.exit(1); }
          console.log('Coverage OK — Stmts:', s.statements.pct + '%', '| Lines:', s.lines.pct + '%', '| Branches:', s.branches.pct + '%', '| Fns:', s.functions.pct + '%');
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/coverage-summary.json
          retention-days: 7

# ─── FRONTEND ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8888/api

      - name: Bundle size check (budget 10MB)
        working-directory: frontend
        run: |
          SIZE=$(du -sm dist/ | cut -f1)
          echo "📏 Bundle: ${SIZE}MB"
          [ "$SIZE" -le 10 ] || (echo "❌ Bundle ${SIZE}MB vượt budget 10MB"; exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

# ─── SUMMARY ─────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          BE="${{ needs.backend.result }}"
          FE="${{ needs.frontend.result }}"
          echo "Backend:  $BE"
          echo "Frontend: $FE"
          [ "$BE" = "success" ] && [ "$FE" = "success" ] && echo "✅ CI passed" || (echo "❌ CI failed"; exit 1)

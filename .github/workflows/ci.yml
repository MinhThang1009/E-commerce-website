name: CI

on:
  push:
    branches: [main, 'phase-*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Least privilege — chỉ cần read code để clone + run tests
permissions:
  contents: read

# Cancel duplicate runs trên cùng branch khi push liên tục (tiết kiệm CI minutes)
# Branch main giữ run hiện tại; PR cancel run cũ khi commit mới push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !contains(github.ref, 'refs/heads/main') }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend (strict — zero warnings)
        working-directory: backend
        run: npm run lint:strict

      - name: Security audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Lint migrations (kiểm tra down() rollback)
        run: bash scripts/lint-migrations.sh

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          # Tests dùng mock — không cần real DB credentials
          DB_NAME: techstore_test
          DB_USER: root
          DB_PASSWORD: ''
          DB_HOST: localhost
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          JWT_REFRESH_SECRET: ci-test-refresh-secret

      - name: Backend test coverage report
        working-directory: backend
        run: npx jest --coverage --ci --runInBand --forceExit
        continue-on-error: true
        env:
          NODE_ENV: test
          DB_NAME: techstore_test
          DB_USER: root
          DB_PASSWORD: ''
          DB_HOST: localhost
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (strict — zero warnings)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Security audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8888/api

      - name: Bundle size check
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sm dist/ | cut -f1)
          echo "📏 Bundle size: ${BUNDLE_SIZE}MB"
          if [ "$BUNDLE_SIZE" -gt 10 ]; then
            echo "⚠️ Bundle size ${BUNDLE_SIZE}MB vượt budget 10MB"
            exit 1
          fi
